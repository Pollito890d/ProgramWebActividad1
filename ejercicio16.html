<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 16 - Calculadora con Funciones Flecha de CDN</title>
    <!-- Inclusión del CDN de SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/ejercicio16.js" defer></script>
    <link rel="stylesheet" href="./css/ejercicio16.css">
</head>
<body>

    <main class="calculadora">
        <h1>Calculadora de Operaciones Básicas</h1>

        <div class="campo">
            <label for="numero1">Número 1:</label>
            <input type="number" id="numero1" placeholder="Ej. 12" step="any">
        </div>

        <div class="campo">
            <label for="numero2">Número 2:</label>
            <input type="number" id="numero2" placeholder="Ej. 4" step="any">
        </div>

        <div class="botones-grid">
            <button type="button" onclick="calcularOperacion('suma')">Sumar (+)</button>
            <button type="button" onclick="calcularOperacion('resta')">Restar (-)</button>
            <button type="button" onclick="calcularOperacion('multiplicacion')">Multiplicar (×)</button>
            <button type="button" onclick="calcularOperacion('division')">Dividir (÷)</button>
        </div>

        <div class="campo">
            <label for="resultado">Resultado:</label>
            <input type="text" id="resultado" readonly placeholder="Resultado">
        </div>

        <p>Regresa al índice principal: <a href="./index.html">Índice Principal</a>.</p>
    </main>

</body>
</html>
