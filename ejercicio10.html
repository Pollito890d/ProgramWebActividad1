<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Grados Celsius a Farenheit</title>
    <script src="./js/ejercicio10.js" defer></script>
</head>
<body>
    <h1>Calculadora de Grados Celsius a Farenheit</h1>
    <div>
        <label for="cel">Grados Celsius</label>
        <input type="number" id="cel" placeholder="Ej. 25" step="any">
    </div>
    <br>
    <button onclick="convertidor()">Convertir</button>
    <br>
    <br>
    <div>
        <label for="resultado">Grados Farenheit:</label>
        <input type="text" id="resultado" readonly placeholder="Resultado">
    </div>
</body>
</html>
