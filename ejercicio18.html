<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18 - Manipulación del DOM con Bootstrap</title>
    <!-- CDN de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="./js/ejercicio18.js" defer></script>
    <link rel="stylesheet" href="./css/ejercicio18.css">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4 text-primary fw-bold">Lista Dinámica</h2>
                        <!-- Formulario de entrada con Bootstrap Input Group -->
                        <div class="input-group mb-3">
                            <input type="text" id="nuevoElemento" class="form-control" placeholder="Escribe un nuevo elemento..." aria-label="Nuevo elemento">
                            <button id="agregarBtn" class="btn btn-primary px-4" type="button">Agregar</button>
                        </div>
                        <!-- Contenedor de la lista -->
                        <ul id="lista" class="list-group list-group-flush rounded border mt-3"></ul>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="./index.html" class="text-decoration-none text-secondary">← Volver al Índice Principal</a>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
